[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
via_ir = true
skip = ["script/deprecated/**"]

# Deploy profile: optimizer on (OP Stack 24KB limit, via_ir helps)
[profile.deploy]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 1

# HSK deploy profile: no via_ir, legacy optimizer — avoids stack-too-deep with linked libraries
[profile.deploy-hsk]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
via_ir = false
optimizer = true
optimizer_runs = 1

[rpc_endpoints]
hashkey-testnet = "https://testnet.hsk.xyz"
hashkey-mainnet = "https://mainnet.hsk.xyz"
kaia-testnet = "https://public-en-kairos.node.kaia.io"
kaia-mainnet = "https://public-en-kaia.node.kaia.io"
localhost = "http://localhost:8545"

[etherscan]
# HashKey Chain explorer verification (Blockscout-based)
hashkey-testnet = { key = "placeholder", url = "https://testnet-explorer.hsk.xyz/api" }
hashkey-mainnet = { key = "placeholder", url = "https://explorer.hsk.xyz/api" }
# Kaiascan verification (legacy — set KAIASCAN_API_KEY in env when verifying)
kaia-testnet = { key = "${KAIASCAN_API_KEY}", url = "https://api-kairos.kaiascan.io" }

[invariant]
runs  = 256
depth = 15
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
