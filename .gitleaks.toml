[allowlist]
  description = "Project-level gitleaks allowlist"

  # Known Anvil/Hardhat test accounts — public, zero-value test keys
  regexes = [
    # Hardhat account #0 — well-known public test key
    '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
    # Hardhat account #1 — well-known public test key
    '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
    # Hardhat account #2
    '''0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
    # Generic test JWT secrets in test files (plaintext "test-secret" patterns)
    '''test-secret-key-that-is-at-least-32-char''',
    # Placeholder Ethereum addresses in tests
    '''0x1234567890abcdef1234567890abcdef12345678''',
    # CI env var placeholder in ci.yml (these are well-known Hardhat test keys in CI)
    '''ci-test-secret-must-be-32-chars-long-min''',
    '''ci-dealer-key''',
  ]

  # Allow .env.example and .env.hashkey.example files (they contain placeholder values)
  paths = [
    '''.env.example''',
    '''.env.hashkey.example''',
    '''docs/security/''',
  ]

  # Allow test files — they use hardcoded Anvil accounts (publicly known)
  [[allowlist.commits]]
  description = "Test files use public Anvil test accounts only"
