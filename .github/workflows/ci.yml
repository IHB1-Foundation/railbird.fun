name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Foundry (Solidity) ─────────────────────────────────────────────────────
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build contracts
        run: cd contracts && forge build --sizes

      - name: Run contract tests
        run: cd contracts && forge test -vvv

      # T-R17-04: Slither is now blocking for medium+ severity findings.
      # Known false positives are suppressed in contracts/slither.config.json:
      #   solc-version      — compiler pinned in foundry.toml
      #   naming-convention — style only, not security
      #   reentrancy-benign — custom nonReentrant modifier used correctly
      #   low-level-calls   — intentional ETH transfers (withdraw/settlement)
      #   calls-loop        — design: settlement callbacks per seat (try-caught)
      #   timestamp         — block.timestamp used for deadlines (acceptable precision)
      - name: Run Slither static analysis
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          slither-args: "--filter-paths contracts/lib/ --exclude-dependencies"
          fail-on: medium

      # T-R12-01: ABI freshness check.
      # Railway excludes @playerco/contracts from its build command because Foundry
      # is not available in the Railway Node.js build environment.  ABIs are
      # committed as TypeScript source in packages/shared/src/abis/ and regenerated
      # locally via `pnpm --filter @playerco/shared generate-abis`.
      # This step verifies the committed ABIs are in sync with the compiled artifacts
      # so stale ABIs are caught in CI rather than silently deployed.
      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies for ABI check
        run: pnpm install --frozen-lockfile

      - name: Check ABI freshness (committed ABIs must match forge artifacts)
        run: |
          pnpm --filter @playerco/shared generate-abis
          if ! git diff --exit-code packages/shared/src/abis/; then
            echo "ERROR: Committed ABIs are out of sync with contract artifacts."
            echo "Run: pnpm --filter @playerco/shared generate-abis && git add packages/shared/src/abis/ && git commit"
            exit 1
          fi
          echo "ABIs are up to date."

  # ── TypeScript type checking ──────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @playerco/shared build

      - name: Type check all packages
        run: pnpm typecheck

  # ── TypeScript / Node.js ───────────────────────────────────────────────────
  typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package (includes ABI generation)
        run: pnpm --filter @playerco/shared build

      - name: Run all TypeScript tests
        run: pnpm test

  # ── Linting ───────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint TypeScript packages
        run: pnpm lint

      - name: Lint Solidity contracts
        run: |
          cd contracts
          npm install --global solhint 2>/dev/null || true
          forge build --silent
          # Run solhint; advisory only until rules are tuned
          solhint 'src/**/*.sol' --ignore-path .solhintignore || true

  # ── Docker image builds ───────────────────────────────────────────────────
  docker-builds:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ownerview image
        run: docker build -f services/ownerview/Dockerfile . --tag playerco/ownerview:ci

      - name: Build indexer image
        run: docker build -f services/indexer/Dockerfile . --tag playerco/indexer:ci

      - name: Build keeper bot image
        run: docker build -f bots/keeper/Dockerfile . --tag playerco/keeper:ci

      - name: Build agent bot image
        run: docker build -f bots/agent/Dockerfile . --tag playerco/agent:ci

  # ── Service startup smoke test (T-R12-02) ────────────────────────────────
  # Runs a lightweight docker-compose stack (anvil + postgres + ownerview + indexer)
  # and checks that all services reach a healthy state within ~60 s.
  # The full 4-agent E2E game is not run here because it requires contract
  # deployment state and takes several minutes; use scripts/e2e-smoke.sh locally.
  service-startup:
    name: Service Startup Smoke Test
    runs-on: ubuntu-latest
    env:
      # Minimal env vars required for the local stack
      KEEPER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      AGENT_PRIVATE_KEY:  "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      VRF_OPERATOR_PRIVATE_KEY: "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"
      JWT_SECRET: "ci-test-secret-must-be-32-chars-long-min"
      DEALER_API_KEY: "ci-dealer-key"
      # Leave contract addresses empty — bots/indexer will start but wait for config
      POKER_TABLE_ADDRESSES: ""
      PLAYER_REGISTRY_ADDRESS: ""
      PLAYER_VAULT_ADDRESS: ""
      VRF_ADAPTER_ADDRESS: ""
      POKER_TABLE_ADDRESS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start core services (anvil, postgres, ownerview, indexer)
        run: |
          # Only bring up services that don't require deployed contracts to be healthy
          docker compose up -d anvil postgres ownerview indexer
          echo "Waiting up to 60s for services to become healthy..."
          timeout 60 bash -c '
            until docker compose ps --format json | \
              python3 -c "
          import sys,json
          data=sys.stdin.read()
          services=[json.loads(l) for l in data.strip().splitlines() if l.strip()]
          targets={\"anvil\",\"postgres\",\"ownerview\",\"indexer\"}
          healthy={s[\"Service\"] for s in services if s.get(\"Health\")==\"healthy\"}
          missing=targets-healthy
          if missing: print(f\"Waiting for: {missing}\"); sys.exit(1)
          print(\"All target services healthy\")
          " 2>/dev/null; do sleep 3; done
          '

      - name: Verify health endpoints
        run: |
          curl -sf http://localhost:3001/health | python3 -m json.tool
          curl -sf http://localhost:3002/api/health | python3 -m json.tool

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=50

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── E2E smoke test (T-R17-01) ─────────────────────────────────────────────
  # Runs a real hand end-to-end: deploy → register → play → verify settlement.
  # Uses 2 agents and 1 hand to keep runtime under 5 minutes.
  e2e:
    name: E2E Smoke Test (1 hand, 2 agents)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @playerco/shared build

      - name: Run E2E smoke test (2 agents, 1 hand)
        run: bash scripts/ci-e2e.sh 1
        timeout-minutes: 5

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Anvil ===" && cat /tmp/ci-anvil.log 2>/dev/null || true
          echo "=== OwnerView ===" && cat /tmp/ci-ownerview.log 2>/dev/null || true
          echo "=== Keeper ===" && cat /tmp/ci-keeper.log 2>/dev/null || true
          echo "=== Agent 0 ===" && cat /tmp/ci-agent0.log 2>/dev/null || true
          echo "=== Agent 1 ===" && cat /tmp/ci-agent1.log 2>/dev/null || true
