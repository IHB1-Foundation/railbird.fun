[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
via_ir = true

# Deploy profile: optimizer on to fit KAIA 49152 byte limit
[profile.deploy]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 1

[rpc_endpoints]
kaia-testnet = "https://public-en-kairos.node.kaia.io"
kaia-mainnet = "https://public-en-kaia.node.kaia.io"
localhost = "http://localhost:8545"

[etherscan]
# Kaiascan verification (set KAIASCAN_API_KEY in env when verifying)
kaia-testnet = { key = "${KAIASCAN_API_KEY}", url = "https://api-kairos.kaiascan.io" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
