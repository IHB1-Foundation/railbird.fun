name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Secret scanning (gitleaks) ────────────────────────────────────────────
  gitleaks:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for history scan

      - name: Run gitleaks
        uses: gacts/gitleaks@v1.3.2
        with:
          config-path: .gitleaks.toml

  # ── Dependency vulnerability audit (pnpm) ─────────────────────────────────
  pnpm-audit:
    name: Dependency Audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high+ blocking)
        run: pnpm audit --audit-level high

  # ── OSV vulnerability scanner ─────────────────────────────────────────────
  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OSV Scanner
        uses: google/osv-scanner-action@v2.3.5
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --skip-git

  # ── Docker image vulnerability scanning (Trivy) ───────────────────────────
  image-scan:
    name: Image Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    # Only run on push to main to keep PR feedback fast
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build all service images
        run: |
          declare -A SERVICES=(
            [indexer]="services/indexer"
            [ownerview]="services/ownerview"
            [fleet]="services/fleet"
            [agent]="bots/agent"
            [keeper]="bots/keeper"
            [vrf-operator]="bots/vrf-operator"
          )
          for name in "${!SERVICES[@]}"; do
            path="${SERVICES[$name]}"
            echo "Building railbird-${name}:ci from ${path}/Dockerfile"
            docker build -t "railbird-${name}:ci" -f "${path}/Dockerfile" .
          done

      - name: Scan indexer
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: railbird-indexer:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          trivyignore-file: .trivyignore

      - name: Scan ownerview
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: railbird-ownerview:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          trivyignore-file: .trivyignore

      - name: Scan fleet
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: railbird-fleet:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          trivyignore-file: .trivyignore

      - name: Scan agent bot
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: railbird-agent:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          trivyignore-file: .trivyignore

      - name: Scan keeper bot
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: railbird-keeper:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          trivyignore-file: .trivyignore

      - name: Scan vrf-operator bot
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: railbird-vrf-operator:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          trivyignore-file: .trivyignore

  # ── Solhint (strict, blocking) ────────────────────────────────────────────
  solhint-strict:
    name: Solhint (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install solhint
        run: npm install --global solhint

      - name: Run solhint (blocking)
        run: |
          cd contracts
          solhint 'src/**/*.sol'
