[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
via_ir = true
skip = ["script/deprecated/**"]

# Deploy profile for the active Initia MiniEVM target.
[profile.deploy]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 1

[rpc_endpoints]
localhost = "http://localhost:8545"
# Initia MiniEVM rollup — set RPC_URL in .env.initia after provisioning
initia-testnet = "${RPC_URL}"

[etherscan]
# Initia rollup explorer (Blockscout-compatible or Initiascan — update URL after rollup provisioning)
initia-testnet = { key = "placeholder", url = "${INITIA_EXPLORER_URL}/api" }

[invariant]
runs  = 256
depth = 15
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[lint]
lint_on_build = false

[profile.deploy-initia]
src = "src"
out = "out-initia"
libs = ["lib"]
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 1
test = "no_tests"
script = "no_scripts"
